<text x="600" y="230" text-anchor="middle" font-family="Arial" font-size="18">PoE</text>
<text x="600" y="260" text-anchor="middle" font-family="Arial" font-size="18">до шкафа 82 м</text>

<rect x="850" y="130" width="260" height="170" fill="#ffe7e7" stroke="#b13b3b" stroke-width="3"/>
