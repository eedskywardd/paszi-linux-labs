<text x="700" y="640" text-anchor="middle" font-family="Arial" font-size="18">межэтажная магистраль</text>

<rect x="980" y="520" width="320" height="190" rx="18" fill="#e7fbff" stroke="#22738b" stroke-width="3"/>
